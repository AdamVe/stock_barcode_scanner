name: stock_barcode_scanner
description: Barcode scanner for goods in stock
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  mobile_scanner: ^5.1.1
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  flutter_mailer:
    git:
      url: https://github.com/AdamVe/flutter_mailer
      ref: adamve-master
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  audioplayers: ^6.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  material_symbols_icons:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.2
  riverpod_lint: ^2.3.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

